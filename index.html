<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>París · Product Discovery</title>
<link rel="stylesheet" href="project/colors_and_type.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    color: var(--fg-1);
    background: var(--bg-2);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { min-height: 100vh; }

  /* ---------- app column ---------- */
  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg-1);
    box-shadow: 0 0 0 1px var(--line-1), 0 24px 60px rgba(19,19,19,.07);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ============ HERO (the one Amplify moment) ============ */
  .hero {
    background: var(--amplify-organic);
    color: var(--fg-on-purple);
    padding: 14px 22px 30px;
    position: relative;
    overflow: hidden;
  }
  .hero__bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .hero__logo { height: 26px; width: auto; display: block; opacity: .96; }

  .langtoggle {
    display: flex; gap: 2px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.28);
    border-radius: var(--radius-pill);
    padding: 3px;
    backdrop-filter: blur(6px);
  }
  .langtoggle__btn {
    font-family: inherit; font-weight: var(--w-semibold); font-size: 12.5px;
    letter-spacing: .04em;
    border: 0; background: transparent; color: rgba(255,255,255,.82);
    padding: 5px 12px; border-radius: var(--radius-pill); cursor: pointer;
    transition: background .18s var(--ease-out, ease), color .18s ease;
  }
  .langtoggle__btn.is-on { background: #fff; color: var(--visma-purple); }

  .hero__body { margin-top: 24px; }
  .hero__eyebrow {
    font-size: var(--fs-overline); font-weight: var(--w-semibold);
    letter-spacing: var(--ls-overline); text-transform: uppercase;
    color: rgba(255,255,255,.85);
  }
  .hero__title {
    font-weight: var(--w-extrabold); font-size: 46px; line-height: 1.0;
    letter-spacing: var(--ls-display); margin: 8px 0 0;
  }
  .hero__dates {
    display: inline-flex; align-items: center; gap: 7px;
    margin-top: 14px; font-size: var(--fs-small); font-weight: var(--w-medium);
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.26);
    padding: 6px 13px; border-radius: var(--radius-pill);
    backdrop-filter: blur(6px);
  }

  /* ============ TABS ============ */
  .tabs {
    position: sticky; top: 0; z-index: 20;
    display: grid; grid-template-columns: 1fr 1fr;
    background: rgba(254,254,254,.86);
    backdrop-filter: blur(12px) saturate(1.4);
    border-bottom: 1px solid var(--line-1);
  }
  .tab {
    appearance: none; border: 0; background: transparent;
    font-family: inherit; font-size: var(--fs-small); font-weight: var(--w-semibold);
    color: var(--fg-3); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 16px 8px; letter-spacing: -.01em;
    transition: color .18s ease;
  }
  .tab.is-on { color: var(--visma-purple); }
  .tab:hover:not(.is-on) { color: var(--fg-2); }
  .tabs__ink {
    position: absolute; left: 0; bottom: -1px;
    height: 2.5px; width: 50%;
    background: var(--visma-purple); border-radius: 3px 3px 0 0;
    transition: transform .26s var(--ease-out, cubic-bezier(.16,.84,.44,1));
  }

  /* ============ CONTENT ============ */
  .content { padding: 24px 20px 40px; flex: 1; }

  .viewhead { margin-bottom: 18px; }
  .viewhead__title {
    font-weight: var(--w-extrabold); font-size: var(--fs-h3);
    letter-spacing: var(--ls-heading); margin: 0;
  }
  .viewhead__lead {
    margin: 6px 0 0; color: var(--fg-2); font-size: var(--fs-small);
    line-height: var(--lh-body); text-wrap: pretty;
  }

  .stack { display: flex; flex-direction: column; gap: 16px; }

  /* ---------- card base ---------- */
  .card {
    background: var(--bg-1);
    border: 1px solid var(--line-1);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-1);
  }
  /* entrance: base state is visible; animate transform only so content
     is never hidden if animation never advances (backgrounded tab) */
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise .42s var(--ease-out, cubic-bezier(.16,.84,.44,1)) backwards; }
    @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
  }

  /* ---------- excursion card ---------- */
  .excard__top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .daychip {
    font-size: var(--fs-caption); font-weight: var(--w-bold);
    color: var(--purple-700); background: var(--purple-100);
    padding: 4px 11px; border-radius: var(--radius-pill);
    letter-spacing: -.01em;
  }
  .datechip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--fs-caption); font-weight: var(--w-medium); color: var(--fg-3);
  }
  .excard__title {
    font-weight: var(--w-bold); font-size: var(--fs-h4); line-height: 1.15;
    letter-spacing: var(--ls-heading); margin: 0;
  }
  .excard__desc {
    margin: 7px 0 0; color: var(--fg-2); font-size: var(--fs-small);
    line-height: var(--lh-body); text-wrap: pretty;
  }

  .metalist {
    margin: 16px 0 18px;
    display: flex; flex-direction: column; gap: 11px;
    padding-top: 16px; border-top: 1px solid var(--line-1);
  }
  .meta { display: flex; align-items: flex-start; gap: 11px; }
  .meta--addr { margin: 14px 0 16px; }
  .meta__ic {
    flex: none; color: var(--visma-purple);
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--purple-050);
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: -3px;
  }
  .meta__val {
    font-size: var(--fs-small); color: var(--fg-1); font-weight: var(--w-medium);
    line-height: 1.4; padding-top: 4px;
  }
  .meta__label {
    display: block; font-size: 11px; font-weight: var(--w-semibold);
    color: var(--fg-3); text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 2px;
  }
  .meta__addr { color: var(--fg-2); font-weight: var(--w-regular); }

  /* ---------- map buttons ---------- */
  .mapbtns { display: flex; align-items: center; gap: 10px; }
  .btn {
    font-family: inherit; font-weight: var(--w-semibold); font-size: var(--fs-small);
    border-radius: var(--radius-pill); cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    text-decoration: none; border: 1.5px solid transparent;
    transition: background .18s ease, transform .12s ease, color .18s ease, border-color .18s ease;
  }
  .btn--primary {
    flex: 1; justify-content: flex-start;
    background: var(--visma-purple); color: #fff;
    padding: 12px 16px; box-shadow: 0 6px 16px rgba(127,86,250,.26);
  }
  .btn--primary:hover { background: var(--purple-600); }
  .btn--primary:active { background: var(--purple-700); transform: translateY(1px); }
  .btn--ghost {
    background: transparent; color: var(--fg-2);
    border-color: var(--line-2); padding: 12px 15px;
  }
  .btn--ghost:hover { color: var(--visma-black); border-color: var(--visma-black); }

  /* ---------- stay card ---------- */
  .staycard__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .staycard__name {
    font-weight: var(--w-bold); font-size: var(--fs-h4); line-height: 1.15;
    letter-spacing: var(--ls-heading); margin: 0;
  }
  .staycard__area { font-size: var(--fs-caption); font-weight: var(--w-medium); color: var(--fg-3); }
  .count {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    font-size: var(--fs-caption); font-weight: var(--w-semibold); color: var(--fg-2);
    background: var(--bg-3); padding: 5px 10px; border-radius: var(--radius-pill);
  }

  .roster { margin: 16px 0 18px; }
  .roster__label {
    display: block; font-size: 11px; font-weight: var(--w-semibold);
    color: var(--fg-3); text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 10px;
  }
  .roster__chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bg-2); border: 1px solid var(--line-1);
    padding: 5px 13px 5px 5px; border-radius: var(--radius-pill);
    font-size: var(--fs-small); font-weight: var(--w-medium); color: var(--fg-1);
    transition: border-color .18s ease, background .18s ease;
  }
  .chip--hit {
    border-color: var(--visma-purple);
    background: var(--purple-050);
    box-shadow: 0 0 0 2px rgba(127,86,250,.16);
  }
  .ava {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: var(--w-bold);
  }

  /* ---------- search ---------- */
  .searchwrap { position: relative; margin-bottom: 14px; }
  .searchwrap__ic {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    color: var(--fg-3); pointer-events: none; display: inline-flex;
  }
  .search {
    width: 100%; font-family: inherit; font-size: var(--fs-body);
    padding: 13px 44px 13px 44px;
    border: 1.5px solid var(--line-2); border-radius: var(--radius-pill);
    background: var(--bg-1); color: var(--fg-1);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .search::placeholder { color: var(--fg-3); }
  .search:focus {
    outline: none; border-color: var(--visma-purple);
    box-shadow: 0 0 0 3px rgba(127,86,250,.16);
  }
  .searchwrap__clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: 0; background: var(--bg-3); color: var(--fg-2);
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .searchwrap__clear:hover { background: var(--cool-grey); color: var(--visma-black); }

  .resultline {
    background: var(--purple-050); border: 1px solid var(--purple-100);
    border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .resultline__row {
    display: flex; align-items: center; gap: 10px;
    font-size: var(--fs-small); color: var(--fg-1);
  }
  .resultline__row strong { font-weight: var(--w-semibold); }
  .noresults {
    color: var(--fg-3); font-size: var(--fs-small); font-weight: var(--w-medium);
    padding: 10px 2px 16px;
  }

  .footnote {
    margin: 28px 0 0; text-align: center;
    font-size: var(--fs-caption); color: var(--fg-3);
  }

  /* ---------- desktop niceties ---------- */
  @media (min-width: 600px) {
    .app { margin: 24px auto; min-height: calc(100vh - 48px); border-radius: var(--radius-xl); overflow: hidden; }
    .tabs { border-radius: 0; }
  }
</style>
</head>

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>&#x2715;</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
  </script>

  <script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

function Icon({ name, size = 18, style }) {
  const p = {
    width: size, height: size, viewBox: "0 0 24 24", fill: "none",
    stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round",
    strokeLinejoin: "round", style,
  };
  switch (name) {
    case "clock":
      return (<svg {...p}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>);
    case "pin":
      return (<svg {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="2.6" /></svg>);
    case "flag":
      return (<svg {...p}><path d="M5 21V4" /><path d="M5 4h11l-2 4 2 4H5" /></svg>);
    case "calendar":
      return (<svg {...p}><rect x="3" y="4.5" width="18" height="16" rx="2.5" /><path d="M3 9h18M8 2.5v4M16 2.5v4" /></svg>);
    case "search":
      return (<svg {...p}><circle cx="11" cy="11" r="7" /><path d="m20 20-3.2-3.2" /></svg>);
    case "users":
      return (<svg {...p}><path d="M16 19v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="3.2" /><path d="M22 19v-2a4 4 0 0 0-3-3.8" /><path d="M16 3.2A4 4 0 0 1 16 11" /></svg>);
    case "arrow":
      return (<svg {...p}><path d="M5 12h14M13 6l6 6-6 6" /></svg>);
    case "x":
      return (<svg {...p}><path d="M6 6l12 12M18 6 6 18" /></svg>);
    default:
      return null;
  }
}

/* Google universal URL: opens native app on mobile, falls back to web */
const gmaps = (addr) =>
  `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;
const amaps = (addr) =>
  `https://maps.apple.com/?q=${encodeURIComponent(addr)}`;

const initials = (name) => name.trim().slice(0, 1).toUpperCase();

const AVA_TINTS = [
  { bg: "var(--purple-100)", fg: "var(--purple-700)" },
  { bg: "#E7EBEC", fg: "#3C4448" },
  { bg: "#F1E7DC", fg: "#7A5A33" },
  { bg: "#E3ECEA", fg: "#2F5E54" },
];
const tintFor = (s) => {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffff;
  return AVA_TINTS[h % AVA_TINTS.length];
};

function Avatar({ name, highlight }) {
  const t = tintFor(name);
  return (
    <span className={"ava" + (highlight ? " ava--hl" : "")}
          style={{ background: highlight ? "var(--visma-purple)" : t.bg,
                   color: highlight ? "#fff" : t.fg }}>
      {initials(name)}
    </span>
  );
}

function MapButtons({ addr, mapUrl, t, mapPref }) {
  const primaryIsApple = mapPref === "apple";
  const googleHref = mapUrl || gmaps(addr);
  const primaryHref = primaryIsApple ? amaps(addr) : googleHref;
  const altHref = primaryIsApple ? googleHref : amaps(addr);
  const altLabel = primaryIsApple ? "Google Maps" : t.appleMaps;
  return (
    <div className="mapbtns">
      <a className="btn btn--primary" href={primaryHref} target="_blank" rel="noopener noreferrer">
        <Icon name="pin" size={17} />
        <span>{t.viewMap}</span>
        <Icon name="arrow" size={16} style={{ marginLeft: "auto", opacity: .8 }} />
      </a>
      <a className="btn btn--ghost" href={altHref} target="_blank" rel="noopener noreferrer">
        {altLabel}
      </a>
    </div>
  );
}

function ExcursionCard({ ex, lang, t, mapPref, i }) {
  return (
    <article className="card excard" style={{ animationDelay: `${i * 70}ms` }}>
      <div className="excard__top">
        <span className="daychip">{ex.day[lang]}</span>
        <span className="datechip"><Icon name="calendar" size={14} />{ex.date[lang]}</span>
      </div>
      <h3 className="excard__title">{ex.title[lang]}</h3>
      <p className="excard__desc">{ex.desc[lang]}</p>

      <div className="metalist">
        <div className="meta">
          <span className="meta__ic"><Icon name="clock" size={16} /></span>
          <span className="meta__val">{ex.time}</span>
        </div>
        <div className="meta">
          <span className="meta__ic"><Icon name="flag" size={16} /></span>
          <span className="meta__val">
            <span className="meta__label">{t.meetPoint}</span>
            {ex.meet[lang]}
          </span>
        </div>
        <div className="meta">
          <span className="meta__ic"><Icon name="pin" size={16} /></span>
          <span className="meta__val meta__addr">{ex.address}</span>
        </div>
      </div>

      <MapButtons addr={ex.address} mapUrl={ex.mapUrl} t={t} mapPref={mapPref} />
    </article>
  );
}

function ExcursionsView({ lang, t, mapPref }) {
  return (
    <section className="view">
      <header className="viewhead">
        <h2 className="viewhead__title">{t.excursionsTitle}</h2>
        <p className="viewhead__lead">{t.excursionsLead}</p>
      </header>
      <div className="stack">
        {window.EXCURSIONS.map((ex, i) => (
          <ExcursionCard key={ex.id} ex={ex} lang={lang} t={t} mapPref={mapPref} i={i} />
        ))}
      </div>
    </section>
  );
}

function StayCard({ st, lang, t, mapPref, query, i }) {
  const q = query.trim().toLowerCase();
  return (
    <article className="card staycard" style={{ animationDelay: `${i * 70}ms` }}>
      <div className="staycard__head">
        <div>
          <h3 className="staycard__name">{st.name}</h3>
          <span className="staycard__area">{st.area[lang]}</span>
        </div>
        <span className="count"><Icon name="users" size={14} />{st.members.length}</span>
      </div>

      <div className="meta meta--addr">
        <span className="meta__ic"><Icon name="pin" size={16} /></span>
        <span className="meta__val meta__addr">{st.address}</span>
      </div>

      <div className="roster">
        <span className="roster__label">{t.sleepsHere}</span>
        <div className="roster__chips">
          {st.members.map((m) => {
            const hit = q && m.toLowerCase().includes(q);
            return (
              <span key={m} className={"chip" + (hit ? " chip--hit" : "")}>
                <Avatar name={m} highlight={hit} />
                {m}
              </span>
            );
          })}
        </div>
      </div>

      <MapButtons addr={st.address} mapUrl={st.mapUrl} t={t} mapPref={mapPref} />
    </article>
  );
}

function StaysView({ lang, t, mapPref }) {
  const [query, setQuery] = useState("");
  const q = query.trim().toLowerCase();

  const { list, matchNames } = useMemo(() => {
    if (!q) return { list: window.ACCOMMODATIONS, matchNames: [] };
    const names = [];
    const list = window.ACCOMMODATIONS.filter((st) => {
      const hits = st.members.filter((m) => m.toLowerCase().includes(q));
      hits.forEach((m) => names.push({ m, st }));
      return hits.length > 0;
    });
    return { list, matchNames: names };
  }, [q]);

  return (
    <section className="view">
      <header className="viewhead">
        <h2 className="viewhead__title">{t.staysTitle}</h2>
        <p className="viewhead__lead">{t.staysLead}</p>
      </header>

      <div className="searchwrap">
        <span className="searchwrap__ic"><Icon name="search" size={18} /></span>
        <input
          className="search"
          type="text"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder={t.searchPlaceholder}
          aria-label={t.searchPlaceholder}
        />
        {query && (
          <button className="searchwrap__clear" onClick={() => setQuery("")} aria-label={t.clear}>
            <Icon name="x" size={16} />
          </button>
        )}
      </div>

      {q && (
        matchNames.length ? (
          <div className="resultline">
            {matchNames.slice(0, 4).map(({ m, st }, idx) => (
              <div key={idx} className="resultline__row">
                <Avatar name={m} highlight />
                <span><strong>{m}</strong> {t.resultPrefix} <strong>{st.name}</strong></span>
              </div>
            ))}
          </div>
        ) : (
          <div className="noresults">{t.noResults}</div>
        )
      )}

      <div className="stack">
        {list.map((st, i) => (
          <StayCard key={st.id} st={st} lang={lang} t={t} mapPref={mapPref} query={query} i={i} />
        ))}
      </div>
    </section>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "defaultLang": "es",
  "mapPref": "google"
}/*EDITMODE-END*/;

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [lang, setLang] = useState(() => {
    const saved = localStorage.getItem("paris.lang");
    return saved === "es" || saved === "en" ? saved : (TWEAK_DEFAULTS.defaultLang || "es");
  });
  const userTouched = useRef(false);
  useEffect(() => { if (userTouched.current) localStorage.setItem("paris.lang", lang); }, [lang]);
  useEffect(() => {
    if (!userTouched.current && !localStorage.getItem("paris.lang")) setLang(tw.defaultLang);
  }, [tw.defaultLang]);

  const [tab, setTab] = useState(() => localStorage.getItem("paris.tab") || "excursions");
  useEffect(() => { localStorage.setItem("paris.tab", tab); }, [tab]);

  const t = window.I18N[lang];
  const trip = window.TRIP;

  const pickLang = (l) => { userTouched.current = true; setLang(l); };

  return (
    <div className="app" lang={lang}>
      <header className="hero">
        <div className="hero__bar">
          <img className="hero__logo" src="project/assets/Visma_White.svg" alt="Visma" />
          <div className="langtoggle" role="tablist" aria-label="Language">
            {["es", "en"].map((l) => (
              <button key={l}
                className={"langtoggle__btn" + (lang === l ? " is-on" : "")}
                onClick={() => pickLang(l)} aria-pressed={lang === l}>
                {l.toUpperCase()}
              </button>
            ))}
          </div>
        </div>
        <div className="hero__body">
          <span className="hero__eyebrow">{trip.team}</span>
          <h1 className="hero__title">{trip.title}</h1>
          <div className="hero__dates"><Icon name="calendar" size={16} />{trip.dates[lang]}</div>
        </div>
      </header>

      <nav className="tabs">
        <button className={"tab" + (tab === "excursions" ? " is-on" : "")}
                onClick={() => setTab("excursions")}>
          <Icon name="flag" size={17} />{t.tabExcursions}
        </button>
        <button className={"tab" + (tab === "stays" ? " is-on" : "")}
                onClick={() => setTab("stays")}>
          <Icon name="pin" size={17} />{t.tabStays}
        </button>
        <span className="tabs__ink" style={{ transform: `translateX(${tab === "stays" ? "100%" : "0"})` }} />
      </nav>

      <main className="content">
        {tab === "excursions"
          ? <ExcursionsView lang={lang} t={t} mapPref={tw.mapPref} />
          : <StaysView lang={lang} t={t} mapPref={tw.mapPref} />}
        <p className="footnote">{t.footerNote}</p>
      </main>

      <TweaksPanel>
        <TweakSection label={lang === "es" ? "Idioma" : "Language"} />
        <TweakRadio
          label={lang === "es" ? "Idioma por defecto" : "Default language"}
          value={tw.defaultLang}
          options={["es", "en"]}
          onChange={(v) => setTweak("defaultLang", v)} />
        <TweakSection label={lang === "es" ? "Mapas" : "Maps"} />
        <TweakRadio
          label={lang === "es" ? "App de mapas principal" : "Primary map app"}
          value={tw.mapPref}
          options={["google", "apple"]}
          onChange={(v) => setTweak("mapPref", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
